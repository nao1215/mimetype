name: CI

# Two compiler lanes:
# - floor (`floor`): the `gleam` requirement in gleam.toml (keep both in sync) on the
#   oldest maintained OTP and Node 22. It proves the declared minimum still builds
#   and passes the tests on both targets.
# - latest (everything else): floats on 1.x with OTP 29 so new compiler warnings,
#   deprecations and formatter changes surface here first. The mime-db check uses it
#   too, because scripts/generate_mime_db.sh runs `gleam format` on the output.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Format / Lint / Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          gleam-version: "1.x"
      - name: Download dependencies
        run: just deps
      - name: Format check
        run: just format-check
      - name: Type check
        run: just typecheck
      - name: Lint
        run: just lint

  floor:
    name: Test (Gleam 1.14.0, OTP 27, Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          gleam-version: "1.14.0"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Download dependencies
        run: gleam deps download
      - name: Test (Erlang)
        run: gleam test --target erlang
      - name: Test (JavaScript)
        run: gleam test --target javascript

  build-and-test:
    name: Build and test (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [erlang, javascript]
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          gleam-version: "1.x"
      - name: Set up Node.js
        if: matrix.target == 'javascript'
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
      - name: Download dependencies
        run: just deps
      - name: Build
        run: just build-${{ matrix.target }}
      - name: Test
        run: just test-${{ matrix.target }}

  readme-up-to-date:
    name: README supported-format section matches signature table
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - name: Verify README is in sync with magic.gleam
        run: just readme-check

  mime-db-up-to-date:
    name: Generated MIME-DB matches script output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          gleam-version: "1.x"
      - name: Determine pinned mime-db commit
        id: pin
        run: |
          set -eu
          COMMIT=$(sed -n 's|.*(\([0-9a-f][0-9a-f]*\))\..*|\1|p' \
            src/mimetype/internal/db.gleam | head -1)
          if [ -z "$COMMIT" ]; then
            echo "could not extract pinned mime-db commit from db.gleam header" >&2
            exit 1
          fi
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
      - name: Clone mime-db at pinned commit
        run: |
          set -eu
          mkdir -p doc/reference/upstream
          git clone https://github.com/jshttp/mime-db.git \
            doc/reference/upstream/mime-db
          git -C doc/reference/upstream/mime-db checkout \
            "${{ steps.pin.outputs.commit }}"
      - name: Download dependencies
        run: just deps
      - name: Regenerate generated MIME-DB sources
        run: just generate-db
      - name: Verify generated files match committed copies
        run: |
          set -eu
          git diff --exit-code -- \
            src/mimetype/internal/db.gleam \
            src/mimetype/internal/mimetype_db_ffi.erl \
            src/mimetype/internal/db_ffi.mjs \
            || {
              echo "::error::Generated MIME-DB files are out of date." \
                "Re-run 'just generate-db' and commit the result."
              exit 1
            }
